<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online ZOO</title>
    <link rel="icon" type="image/svg+xml" href="icons/Favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="" class="header-logo" href="/">
          <img
            src="icons/Logo.svg"
            alt="ZOO logo"
            class="header-logo-image"
            width="96"
            height="50"
            loading="lazy"
          />
        </a>
        <div class="header-elements">
          <nav class="header-menu">
            <ul class="header-menu-list">
              <li class="header-menu-item">
                <a href="" class="header-menu-link">About</a>
              </li>
              <li class="header-menu-item">
                <a href="" class="header-menu-link">Map</a>
              </li>
              <li class="header-menu-item">
                <a href="" class="header-menu-link">Zoos</a>
              </li>
              <li class="header-menu-item">
                <a href="" class="header-menu-link">Contact us</a>
              </li>
              <li class="header-menu-item">
                <a href="" class="header-menu-link">Design</a>
              </li>
            </ul>
          </nav>
          <nav class="header-socialMenu">
            <ul class="header-socialMenu-list">
              <li class="header-socialMenu-item">
                <a href="" class="header-socialMenu-link">
                  <img
                    src="icons/youtube.svg"
                    alt="youtube logo"
                    class="header-logo-icon"
                    width="40"
                    height="40"
                    loading="lazy"
                  />
                </a>
              </li>
              <li class="header-socialMenu-item">
                <a href="" class="header-socialMenu-link">
                  <img
                    src="icons/instagram.svg"
                    alt="instagram logo"
                    class="header-logo-icon"
                    width="40"
                    height="40"
                    loading="lazy"
                  />
                </a>
              </li>
              <li class="header-socialMenu-item">
                <a href="" class="header-socialMenu-link">
                  <img
                    src="icons/facebook.svg"
                    alt="facebook logo"
                    class="header-logo-icon"
                    width="40"
                    height="40"
                    loading="lazy"
                  />
                </a>
              </li>
            </ul>
          </nav>
          <button class="header-burger" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <div>Hello world1!</div>
    </main>
  </body>
</html>
